# Made-up example configuration for ha-config-doctor.
# Every mistake in this folder is deliberate. Nothing here is real.

homeassistant:
  name: Example Home
  unit_system: metric
  time_zone: Europe/London
  # Made-up location (open sea, roughly mid-England latitude) used only for sunrise/sunset maths.
  latitude: 52.0
  longitude: -1.0
  whitelist_external_dirs:
    - /config/www
  packages: !include_dir_named packages
  customize: !include customize.yaml

default_config:

http:
  base_url: https://example.invalid
  api_password: !secret http_password

recorder:
  purge_interval: 2

zwave:
  usb_path: /dev/ttyACM0

map:

automation: !include automations.yaml
automation manual: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

group: !include Groups.yaml
shell_command: !include shell_commands.yaml
rest_command: !include missing_rest_commands.yaml

sensor:
  - platform: template
    sensors:
      outside_feels_like:
        friendly_name: "Outside feels like"
        entity_id: sensor.garden_temperature
        value_template: "{{ states('sensor.garden_temperature') | float + 1 }}"
  - platform: mqtt
    name: "Shed temperature"
    state_topic: "example/shed/temperature"
  - platform: ping
    host: router.example.invalid
    name: "Router ping"

template:
  - trigger:
      - platform: time_pattern
        hours: "/1"
    sensor:
      - name: "Hourly marker"
        unique_id: example_hourly_marker
        state: "{{ now().hour }}"
  - sensor:
      - name: "Hall power doubled"
        unique_id: example_hall_power_doubled
        state: "{{ states('sensor.hall_plug_power') | float * 2 }}"
      - name: "Broken template"
        unique_id: example_broken_template
        state: "{{ states('sensor.hall_plug_power') | float(0) * 2 }"

input_boolean:
  guest_mode:
    name: Guest mode
  holiday_mode:
    name: Holiday mode
  never_used_flag:
    name: A flag nobody uses

input_number:
  target_temperature:
    name: Target temperature
    min: 10
    max: 25
    step: 0.5

timer:
  hall_light_timer:
    duration: "00:05:00"

old_settings: !include ../outside.yaml
misc: !include missing_file.yaml
weird: !includ something.yaml
looped: !include loop_a.yaml
oops: !include broken.yaml
accents: !include latin1.yaml
secret_bits: !include secrets.yaml
environment_value: !env_var EXAMPLE_VARIABLE
