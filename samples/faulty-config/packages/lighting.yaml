# Package: lighting. Hand-written, with comments that tidy mode must keep.
automation:
  # Landing light at dusk, written the old way on purpose.
  - alias: Landing light at dusk
    id: landing_light_dusk
    trigger:
      platform: sun  # the old name
      event: sunset
    action:
      - service: light.turn_on  # the old name
        data:
          entity_id: light.landing
          brightness_pct: 40
    mode: restart
    max: 3

  - alias: Greeting
    id: package_greeting
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door
        from: "off"
        to: "on"
    actions:
      - action: notify.notify
        data:
          message: !input greeting

input_text:
  - name: Note

mqtt:
  sensor:
    - name: "Shed humidity"
      state_topic: "example/shed/humidity"
  password: !secret mqtt_pasword

notify:
  - platform: smtp
    name: email_alerts
    server: smtp.example.invalid
    sender: alerts@example.com
    username: alerts@example.com
    password: inline-fake-password-456
    recipient: someone@example.com
