      target:
        entity_id: light.garden
- id: "1700000000009"
  alias: Wait for the door to close
  mode: queued
  max: 50
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door
      from: "off"
      to: "on"
  actions:
    - wait_template: "{{ is_state('binary_sensor.front_door', 'off') }}"
    - repeat:
        while:
          - condition: state
            entity_id: binary_sensor.front_door
            state: "on"
        sequence:
          - action: notify.notify
            data:
              message: The front door is still open
- id: "1700000000010"
  alias: Log every power reading
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.hall_plug_power
  actions:
    - delay: 30
    - action: logbook.log
      data_template:
        name: Power
        message: "{{ states('sensor.hall_plug_power') }}"
- id: "1700000000011"
  alias: Keep the lounge lamp toggling
  mode: parallel
  triggers:
    - trigger: state
      entity_id: light.lounge_lamp
    - trigger: state
      entity_id: binary_sensor.kitchen_motion
      to: unavailable
  actions:
    - action: light.toggle
      target:
        entity_id: light.lounge_lamp
- id: "1700000000012"
  alias: Impossible conditions
  triggers:
    - trigger: numeric_state
      entity_id: sensor.lounge_temperature
      above: 25
      below: 18
    - trigger: numeric_state
      entity_id: binary_sensor.front_door
      above: 0
    - trigger: state
      entity_id: light.kitchen
      from: "on"
      to: "on"
    - trigger: state
      entity_id: light.kitchen
      from: "on"
      to: "on"
  conditions:
    - condition: sun
      after: sunset
      before: sunrise
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "on"
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.kitchen
- id: "1700000000013"
  alias: Switched-off triggers
  triggers:
    - trigger: template
      value_template: "true"
      enabled: false
    - trigger: state
      entity_id: "{{ 'light.' ~ 'hall' }}"
      enabled: false
  actions:
    - action: light.turn_off
      target:
        entity_id: light.hall
- id: "1700000000014"
  alias: Mixed up trigger ids
