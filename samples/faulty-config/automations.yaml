      id: regular
    - trigger: sunrise
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: mornign
          sequence:
            - delay: 5 minutes
    - action: light.turn_on
      target:
        entity_id: Light.Hall
    - condition: weather
    - delayy: 5
