# Made-up automations for ha-config-doctor's sample. Every mistake is deliberate.
- id: "1700000000001"
  alias: Hall light on with motion
  description: Turns the hall light on when someone walks past.
  trigger:
    - platform: state
      entity_id: binary_sensor.hall_motion
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.hall
    - delay: "00:05:00"
    - service: light.turn_off
      target:
        entity_id: light.hall
- id: "1700000000002"
  alias: Landing light on with motion
  description: Turns the landing light on when someone walks past.
  trigger:
