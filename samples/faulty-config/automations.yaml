- id: "1700000000028"
  alias: Deeply nested
  triggers:
    - trigger: state
      entity_id: binary_sensor.hall_motion
      to: "on"
      not_from: ["unavailable", "unknown"]
  conditions:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: light.hall
              state: "off"
          sequence:
            - if:
                - condition: state
                  entity_id: light.kitchen
                  state: "off"
              then:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: light.landing
                          state: "off"
                      sequence:
                        - if:
                            - condition: state
                              entity_id: light.porch
                              state: "off"
                          then:
                            - action: light.turn_on
                              target:
                                entity_id: light.hall
