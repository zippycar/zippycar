goodnight_lights:
  alias: Goodnight lights
  sequence:
    - action: light.turn_off
      target:
        entity_id: light.kitchen
    - action: light.turn_off
      target:
        entity_id: light.hall
    - action: lock.lock
      target:
        entity_id: lock.front_door
announce_on_screen:
  alias: Send a message to the hall display
  sequence:
    - action: mqtt.publish
      data:
        topic: example/hall_display/message
        payload: Dinner is ready
morning_wait:
  alias: Wait for sunrise
  sequence:
    - wait_for_trigger:
        - platform: sun
          event: sunrise
    - action: cover.open_cover
      target:
        entity_id: cover.lounge_blind
