[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-config-doctor"
version = "1.0.0"
description = "A careful, read-only health check for Home Assistant configuration folders and automations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18.6",
    "Jinja2>=3.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ha-config-doctor = "ha_config_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
